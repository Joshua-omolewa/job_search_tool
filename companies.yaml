# Company registry for the job discovery pipeline.
# ats: one of "greenhouse" | "ashby" | "workable" | "lever" | "smartrecruiters"
#   | "workday" | "bamboohr" | "rippling" | "teamtailor" | "gem"
#   | "oraclecloud" | "successfactors" | "icims" | "eightfold" | "cornerstone"
#   | "avature" | "hrdepartment" | "gr8people" | "google" | "apple" | "shopify"
#   | "meta"
# slug: the identifier used in that ATS's public API URL
#   - workday is the odd one out: slug is "{tenant}.wd{N}/{site}", read off
#     the company's careers URL — e.g.
#     https://nvidia.wd5.myworkdayjobs.com/en-US/NVIDIAExternalCareerSite/...
#     gives slug "nvidia.wd5/NVIDIAExternalCareerSite" (drop the locale
#     segment, e.g. "en-US", if present). See ats_clients.fetch_workday's
#     CONFIDENCE NOTE for how this was verified.
#   - bamboohr's slug is just the {slug} in https://{slug}.bamboohr.com/careers/
#     — e.g. https://explorance.bamboohr.com/careers/ gives slug "explorance".
#   - rippling's slug is the board slug from https://ats.rippling.com/{slug}/jobs
#     — e.g. https://ats.rippling.com/urban-sdk/jobs gives slug "urban-sdk".
#   - teamtailor's slug is just the {slug} in https://{slug}.teamtailor.com/jobs
#     — e.g. https://chip.teamtailor.com/jobs gives slug "chip".
#   - gem's slug is the vanity path from https://jobs.gem.com/{slug}
#     — e.g. https://jobs.gem.com/11x-ai gives slug "11x-ai". See
#     ats_clients.fetch_gem's CONFIDENCE NOTE — this one's reverse-engineered
#     from an undocumented internal API, same caveat as workday.
#   - The 12 types below (added 2026-09-27) are each a real, unauthenticated
#     way to read job data — either the company's own enterprise ATS's real
#     public API (oraclecloud/successfactors/icims/eightfold/cornerstone),
#     no API at all so it's HTML-scraped instead (avature/hrdepartment), an
#     undocumented internal API their own custom career site's frontend
#     calls (google/apple/meta), or React Router's own "single fetch" data
#     endpoint (shopify) — gr8people has a real public GraphQL API too but
#     the one real customer checked (EA) blocks this project's own network,
#     so it's unverified end-to-end; see each fetcher's own docstring in
#     ats_clients.py for exactly how it was reverse-engineered/verified.
#   - oraclecloud's slug is "{host}/{site-id}" — {host} is whatever hostname
#     the company's public careers page redirects to (works whether that's
#     a raw *.fa.{region}.oraclecloud.com host or the company's own CNAME'd
#     vanity domain — both answer the API directly), {site-id} is the
#     trailing path segment of that redirect, e.g. careers.ti.com redirects
#     to .../en/sites/CX, giving slug "edbz.fa.us2.oraclecloud.com/CX".
#   - successfactors' slug is just the company's own careers hostname, e.g.
#     "jobs.bce.ca" — the real data comes from a "Google for Jobs" XML feed
#     at https://{slug}/googleforjobs.xml every SuccessFactors Career Site
#     Builder site exposes (NOT always at /sitemap.xml — some tenants
#     reserve that path for a real, jobless URL sitemap instead).
#   - icims' slug is the company's OWN custom careers domain (NOT an
#     icims.com subdomain — those are WAF/CAPTCHA-blocked), e.g.
#     "careers.amd.com" — only iCIMS' newer "Attract"-branded front-ends
#     (recognizable by a `window._jibe`/`app.jibecdn.com` reference in the
#     page source) expose the public /api/jobs endpoint this uses.
#   - eightfold's slug is "{host}/{domain}" — {host} is whatever domain the
#     careers site itself lives on (may be *.eightfold.ai or the company's
#     own custom domain), {domain} is the company's plain public domain
#     (e.g. "netflix.com") used as the API's own scoping param — found
#     embedded in the careers page's own HTML (a `"domain":"..."` field in
#     an inline pcsx-data script block).
#   - cornerstone's slug is "{tenant}/{careerSiteId}", read off the
#     company's real careers URL — e.g. macomtech.csod.com/ux/ats/
#     careersite/4/home?c=macomtech gives slug "macomtech/4".
#   - avature's and hrdepartment's slugs are just the tenant subdomain, e.g.
#     "synopsys" (for synopsys.avature.net) or "sanminacareers.mua" (for
#     sanminacareers.mua.hrdepartment.com).
#   - gr8people's slug is the tenant subdomain, e.g. "ea" for
#     ea.gr8people.com.
#   - google's slug is the `location` query param its search uses to scope
#     results server-side (Google's board is huge and worldwide, so this
#     keeps a fetch to a relevant subset, the same way aggregators.yaml's
#     `where` scopes Adzuna) — e.g. "United States". A separate entry is
#     needed per country/region you want covered (Google's own location
#     query only accepts one value, no combined "US+Canada" form found).
#   - apple's slug is "{locale}/{location}" — Apple partitions results by
#     LOCALE PATH (e.g. /en-us/search vs /en-ca/search), not just a query
#     param: a Canada-shaped location value on the /en-us/ path returns 0,
#     not Canada's real results — confirmed live 2026-09-27, this was
#     missed on the first pass and meant Apple silently returned 0 US
#     candidates too (see ats_clients.fetch_apple's comment for the
#     related location-string bug this was found alongside). Each
#     locale+location pair needs its own companies.yaml entry, same
#     reasoning as Google above — e.g. "en-us/united-states-USA" and
#     "en-ca/canada-CANC" (note Apple's own Canada location code is
#     "CANC", not "CAN").
#   - shopify's and meta's slugs are unused by the fetcher itself
#     (single-company fetchers), but still need a real, non-empty value
#     (e.g. "shopify") rather than being left blank — a blank value parses
#     as YAML null, which breaks `--company <slug>` debugging since
#     main.py matches by exact slug.
#
# The list below is the original author's real target list (Alberta/Canada
# tech companies), kept as-is as a working example of the format. Add or
# remove entries to match who you're actually applying to — see the
# README's "Customize for your own search" section.

